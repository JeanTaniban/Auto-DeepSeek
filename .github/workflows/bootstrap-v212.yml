name: Bootstrap validated V2.12

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify validated archive
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum bootstrap/v212.zip | awk '{print $1}')"
          test "$actual" = "292ada2d80e12e1f2d0a48c198a43f81b7e39f979e1212cf46099c3adf4f1929"
          cp bootstrap/v212.zip "$RUNNER_TEMP/v212.zip"

      - name: Replace bootstrap tree with validated source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          for path in Path('.').iterdir():
              if path.name == '.git':
                  continue
              if path.is_dir() and not path.is_symlink():
                  shutil.rmtree(path)
              else:
                  path.unlink()
          PY
          unzip -q "$RUNNER_TEMP/v212.zip" -d .

      - name: Install and validate source tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m compileall -q clipboard_agent main.py
          python -m pytest -q

      - name: Commit validated V2.12 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import validated V2.12 source tree (local ce3156b)"
          git push origin HEAD:main
