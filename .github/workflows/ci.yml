name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -U pip && python -m pip install -r requirements.txt
      - name: Windows launcher smoke test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call windows_python.bat --ensure-pip
          if errorlevel 1 exit /b 1
          "%CAR_PYTHON_EXE%" -c "import sys; assert sys.version_info >= (3, 11)"
      - name: Compile
        run: python -m compileall -q clipboard_agent main.py
      - name: Test
        run: python -m pytest -q
