[project]
name = "clipboard-agent-relay"
version = "2.12.0"
description = "Semi-automatic clipboard relay between a web LLM and local development tools"
requires-python = ">=3.11"
dependencies = [
  "opencv-python-headless>=4.10,<5",
  "psutil>=6,<8",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
